[package]
name = "ctrl-alt-delegate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Discord presence for most of your coding tools"
publish = false

[lib]
name = "cad"
path = "src/lib.rs"

# Tray app and presence service (no console window).
[[bin]]
name = "ctrl-alt-delegate"
path = "src/main.rs"

# Console companion: agent hooks and command-line control.
[[bin]]
name = "cad"
path = "src/cad.rs"

[dependencies]
tray-icon = "=0.26.1"
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_WindowsProgramming",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
