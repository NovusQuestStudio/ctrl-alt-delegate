[package]
name = "ctrl-alt-delegate-tray"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "System tray controls for the Ctrl Alt Delegate Discord presence service"
publish = false

[[bin]]
name = "ctrl-alt-delegate-tray"
path = "src/main.rs"

[dependencies]
tray-icon = "=0.26.1"
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
